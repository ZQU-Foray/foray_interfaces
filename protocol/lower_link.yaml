# 上位机 ↔ 下位机链路协议 —— 机器可读定义（唯一事实来源）
#
# 两侧代码由 scripts/gen_lower_link.py 生成，禁止手写编解码。
# 人读规范见 protocol/lower_link.md
#
# ⚠️ 消息表 messages: 为空 —— 由算法组与电控组共同确定，本仓不预设。
#    填写要求见规范「消息表」一节；新增消息照抄下面段的模板即可。
#
# 改协议 = 改本文件 + 重新生成 + 提交。CI 会校验生成物与 YAML 一致。

protocol:
  name: lower_link
  version: "0.1.0"
  status: draft
  description: 上位机 ↔ 下位机 USB CDC 链路协议

# ─────────── 帧格式（结构，本仓维护）───────────
frame:
  sof: [0xA5, 0x5A] # 帧头魔数，2 B
  endian: little
  crc: crc16-ccitt-false
  crc_covers: [len, seq, msg_id, payload] # 不含 SOF
  max_payload: 250 # LEN 是 1 字节，故 ≤ 255
  header_bytes: 5 # sof(2) + len(1) + seq(1) + msg_id(1)
  trailer_bytes: 2 # crc16

# ─────────── 时序（内容，待填写）───────────
timing:
  heartbeat_hz: 0 # ⬜ 待填写
  # 超时阈值。键名 = 消息 name 的小写下划线形式，生成 kTimeout<Key>Ms 常量。
  # 例：chassis_cmd: 100  →  constexpr uint32_t kTimeoutChassisCmdMs = 100;
  timeouts_ms: {} # ⬜ 待填写

# ─────────── 消息号分段（建议，可改）───────────
id_ranges:
  - { range: "0x00-0x0F", purpose: "控制类（上→下）" }
  - { range: "0x10-0x1F", purpose: "状态类（下→上）" }
  - { range: "0x20-0x2F", purpose: "透传 / 转发" }
  - { range: "0x30-0x3F", purpose: "配置 / 标定" }
  - { range: "0x70-0x7F", purpose: "链路管理（双向）" }

# ═══════════════════════════════════════════════════════════════════════
# 消息表 —— 待填写
#
# 新增一条消息：把下面这段复制到 messages: 下，按需修改。
#
#   - id: 0x01                  # 消息号，参考上面的 id_ranges
#     name: CHASSIS_CMD         # 全大写；生成 enum class MsgId 的枚举名 + 同名 struct
#     direction: host_to_mcu    # host_to_mcu | mcu_to_host | bidirectional
#     period_hz: 100            # 0 = 事件触发
#     status: proposed          # 自由标记，只进文档表格，不进代码
#     doc: 一句话说明            # 进生成代码的注释
#     fields:
#       - { name: vx, type: float32, unit: m/s, frame: body }
#       - { name: vy, type: float32, unit: m/s, frame: body }
#       - { name: wz, type: float32, unit: rad/s, frame: body }
#
# 字段支持的键：name（必填）· type（必填）· unit · note · frame
# 字段支持的类型：float32 | uint8 | uint16 | uint32 | int16 | bool
#   数组写 float32[4]、uint8[128]。⚠️ 流式写法里必须加引号：type: "int16[4]"
#   （不加引号时 `[` 会被 YAML 当成流式序列的开始，解析结果与预期不符）
#   类型清单与字节数见生成器顶部的 TYPES 表；新类型改那里。
#
# 改完执行：python3 scripts/gen_lower_link.py
# ═══════════════════════════════════════════════════════════════════════
messages: []
